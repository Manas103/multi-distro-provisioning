# The same host contract shape as fleet-environment-check-gate (kernel tuning, package
# versions, listening ports, systemd unit state), reused here as the acceptance test a booted
# image must pass before this pipeline promotes it. Package names/versions are pinned to what
# this role set actually installs on each distribution so the check is exact, not a range.

[ubuntu]
kernel = { "net.ipv4.ip_forward" = "0", "vm.swappiness" = "10" }
packages = { openssh-server = "1:8.9p1-3ubuntu0.17", chrony = "4.2-2ubuntu2.1", auditd = "1:3.0.7-1ubuntu0.1" }
ports = [22, 9100]
# Ubuntu's units are ssh.service and chrony.service (Rocky/RHEL: sshd.service, chronyd.service).
units = { ssh = "active", chrony = "active", node_exporter = "active" }

[rocky]
kernel = { "net.ipv4.ip_forward" = "0", "vm.swappiness" = "10" }
packages = { openssh-server = "9.9p1-7.el9_8.rocky.0.1", chrony = "4.8-1.el9", audit = "3.1.5-8.el9" }
ports = [22, 9100]
units = { sshd = "active", chronyd = "active", node_exporter = "active" }
